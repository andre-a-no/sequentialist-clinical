[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequentialist-clinical"
dynamic = ["version"]
description = "Interim monitoring of clinical trials: group sequential and anytime-valid designs, analyses at data cut-offs, DSMB reports and an audit trail"
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Commercial"  # see COMMERCIAL.md
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.8"
authors = [{ name = "Andrej Novikov" }]
maintainers = [{ name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" }]
keywords = ["clinical trials", "interim analysis", "group sequential", "alpha spending", "data monitoring committee",
            "DSMB", "log-rank", "anytime-valid", "CDISC", "ADaM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "sequentialist-core>=0.1,<0.2",
    "sequential-analysis>=0.4,<0.5",
]

[project.optional-dependencies]
yaml = ["sequentialist-core[yaml]>=0.1,<0.2"]

[project.entry-points."sequentialist.commands"]
clinical = "sequentialist.clinical.cli:register"

[project.urls]
Source = "https://github.com/andre-a-no/sequentialist-clinical"
Issues = "https://github.com/andre-a-no/sequentialist-clinical/issues"
"Commercial license" = "https://github.com/andre-a-no/sequentialist-clinical/blob/main/COMMERCIAL.md"

[tool.setuptools.dynamic]
version = { attr = "sequentialist.clinical.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequentialist.clinical*"]
namespaces = true

[tool.setuptools.package-data]
"sequentialist.clinical" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.isort]
known-first-party = ["sequentialist"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"  # mypy checks types only; the code runs on 3.8 (see CI)
mypy_path = "src"
files = ["src/sequentialist"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
